# Local development database only — production stack lives in docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: playforge-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: playforge
      POSTGRES_PASSWORD: playforge
      POSTGRES_DB: playforge
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
